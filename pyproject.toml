[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clickstream-pipeline"
version = "2.0.0"
description = "Batch clickstream pipeline: raw logs to validated, partitioned Parquet with SQL reporting"
requires-python = ">=3.10"
dependencies = ["pyspark>=3.5", "pyarrow>=14"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
src = ["src", "tests", "dags"]
